<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<title>Search Log — Conquest Auto Parts</title>
<style>
  body { font-family: -apple-system, sans-serif; max-width: 900px; margin: 30px auto; padding: 0 20px; color: #1a1d21; background: #faf9f7; }
  h1 { font-size: 20px; }
  .setup { background: #fdf1ec; border: 2px solid #d94a1f; border-radius: 8px; padding: 14px; margin-bottom: 20px; }
  .setup input { padding: 8px 10px; font-size: 14px; border: 1px solid #ccc; border-radius: 6px; width: 320px; }
  .setup button { padding: 8px 14px; font-size: 14px; font-weight: 700; background: #d94a1f; color: #fff; border: none; border-radius: 6px; cursor: pointer; margin-left: 6px; }
  #status { color: #5b6472; font-size: 13px; margin: 10px 0 20px; }

  .conversation {
    background: #fff;
    border: 1.5px solid #e3e1dc;
    border-radius: 12px;
    margin-bottom: 22px;
    overflow: hidden;
  }
  .conv-header {
    background: #1a1d21;
    color: #fff;
    padding: 10px 16px;
    font-size: 13px;
    font-weight: 700;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .conv-header .no-session { color: #f4b183; font-weight: 500; font-size: 11.5px; }
  .turn { padding: 12px 16px; border-bottom: 1px solid #f0efec; }
  .turn:last-child { border-bottom: none; }
  .turn-time { font-size: 11px; color: #9a9da2; margin-bottom: 6px; }
  .bubble-row { display: flex; margin-bottom: 8px; }
  .bubble-row.customer { justify-content: flex-end; }
  .bubble {
    max-width: 80%;
    padding: 8px 12px;
    border-radius: 10px;
    font-size: 13.5px;
    line-height: 1.45;
  }
  .bubble.customer { background: #1a1d21; color: #fff; }
  .bubble.bot { background: #f0efec; color: #1a1d21; }
  .turn-meta { font-size: 11.5px; color: #8a8f98; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .outcome { padding: 2px 8px; border-radius: 999px; font-size: 10.5px; font-weight: 700; white-space: nowrap; }
  .outcome-no_match, .outcome-part_number_not_carried { background: #fde2e2; color: #b53a15; }
  .outcome-single_match, .outcome-sku_direct_match { background: #dff2e6; color: #2f7a52; }
  .outcome-multiple_matches { background: #eef2fd; color: #3b5bdb; }
  .outcome-needs_type_selection, .outcome-too_many_matches { background: #fff3d6; color: #a06b00; }
  .outcome-asked_for_year, .outcome-asked_for_make_model, .outcome-asked_for_model { background: #f0f0ee; color: #5b6472; }
  .products-list { font-size: 11.5px; color: #4b5563; margin-top: 4px; }
  .purchased-badge {
    background: #2f7a52; color: #fff; font-size: 11px; font-weight: 800;
    padding: 3px 10px; border-radius: 999px;
  }
</style>
</head>
<body>
  <h1>🔧 Search Log</h1>
  <div class="setup">
    <label>Backend URL: </label>
    <input id="apiBase" value="https://conquest-fitment-chatbot.onrender.com" />
    <label style="margin-left:10px;">Admin Secret: </label>
    <input id="secret" type="password" placeholder="paste your ADMIN_SECRET" />
    <button onclick="loadLog()">Load</button>
  </div>
  <div id="status"></div>
  <div id="conversations"></div>

  <script>
    const savedBase = localStorage.getItem('cap-log-apiBase');
    const savedSecret = localStorage.getItem('cap-log-secret');
    if (savedBase) document.getElementById('apiBase').value = savedBase;
    if (savedSecret) document.getElementById('secret').value = savedSecret;

    function stripHtml(s) {
      return (s || '').replace(/<[^>]+>/g, '');
    }

    async function loadLog() {
      const apiBase = document.getElementById('apiBase').value.trim();
      const secret = document.getElementById('secret').value.trim();
      localStorage.setItem('cap-log-apiBase', apiBase);
      localStorage.setItem('cap-log-secret', secret);

      const status = document.getElementById('status');
      const container = document.getElementById('conversations');
      status.textContent = 'Loading…';
      container.innerHTML = '';

      try {
        const res = await fetch(`${apiBase}/api/admin/search-log?limit=1000`, {
          headers: { 'x-admin-secret': secret },
        });
        if (res.status === 401) {
          status.textContent = 'Wrong secret — check your ADMIN_SECRET value.';
          return;
        }
        const data = await res.json();

        let sessionOrders = {};
        try {
          const soRes = await fetch(`${apiBase}/api/admin/session-orders?days=30`, {
            headers: { 'x-admin-secret': secret },
          });
          const soData = await soRes.json();
          sessionOrders = soData.sessionOrders || {};
        } catch (e) {
          // Purchase data is a bonus, not required — the log itself still works without it.
        }

        // Group into conversations by sessionId. Entries logged before
        // session tracking existed have no sessionId — each of those shows
        // as its own single-turn conversation rather than being merged
        // together, since there's no reliable way to group them otherwise.
        const groups = new Map();
        let anonCounter = 0;
        data.entries.forEach((e) => {
          const key = e.sessionId || `__no_session_${anonCounter++}`;
          if (!groups.has(key)) groups.set(key, []);
          groups.get(key).push(e);
        });

        const conversations = Array.from(groups.entries()).map(([key, entries]) => {
          entries.sort((a, b) => new Date(a.timestamp) - new Date(b.timestamp));
          return { key, entries, latest: new Date(entries[entries.length - 1].timestamp) };
        });
        conversations.sort((a, b) => b.latest - a.latest);

        const purchasedCount = conversations.filter((c) => c.entries[0].sessionId && sessionOrders[c.entries[0].sessionId]).length;
        status.textContent = `${data.total} total logged turns, grouped into ${conversations.length} conversation${conversations.length === 1 ? '' : 's'}. ${purchasedCount} led to a purchase.`;

        conversations.forEach((conv) => {
          const first = conv.entries[0];
          const startTime = new Date(first.timestamp).toLocaleString();
          const hasSession = !!first.sessionId;
          const order = first.sessionId ? sessionOrders[first.sessionId] : null;

          const card = document.createElement('div');
          card.className = 'conversation';

          const header = document.createElement('div');
          header.className = 'conv-header';
          header.innerHTML = `
            <span>Conversation started ${startTime} — ${conv.entries.length} turn${conv.entries.length === 1 ? '' : 's'}</span>
            <span style="display:flex; gap:8px; align-items:center;">
              ${order ? `<span class="purchased-badge">✅ Purchased — ${order.orderName} ($${order.total})</span>` : ''}
              ${hasSession ? '' : '<span class="no-session">no session ID (logged before grouping was added)</span>'}
            </span>
          `;
          card.appendChild(header);

          conv.entries.forEach((e) => {
            const turn = document.createElement('div');
            turn.className = 'turn';
            const time = new Date(e.timestamp).toLocaleTimeString();
            const criteriaBits = [e.criteria?.year, e.criteria?.make, e.criteria?.model, e.criteria?.keyword]
              .filter(Boolean).join(' ');
            const customerText = e.message || (criteriaBits ? `[selected: ${criteriaBits}]` : '[narrowing step]');
            const botText = stripHtml(e.reply) || (e.criteria?.error ? `⚠️ ${e.criteria.error}` : '(no response recorded)');
            const productsText = (e.results || []).slice(0, 5).map((r) => r.title).join('; ') ||
              (e.options || []).slice(0, 5).join('; ') || '';

            turn.innerHTML = `
              <div class="turn-time">${time}</div>
              <div class="bubble-row customer"><div class="bubble customer"></div></div>
              <div class="bubble-row bot"><div class="bubble bot"></div></div>
              <div class="turn-meta">
                <span class="outcome outcome-${e.outcome}">${(e.outcome || '').replace(/_/g, ' ')}</span>
                <span>${e.matchCount != null ? e.matchCount + ' match' + (e.matchCount === 1 ? '' : 'es') : ''}</span>
              </div>
              ${productsText ? `<div class="products-list">${productsText}</div>` : ''}
            `;
            turn.querySelector('.bubble.customer').textContent = customerText;
            turn.querySelector('.bubble.bot').textContent = botText;
            card.appendChild(turn);
          });

          container.appendChild(card);
        });
      } catch (err) {
        status.textContent = 'Error loading log: ' + err.message;
      }
    }

    if (savedSecret) loadLog();
  </script>
</body>
</html>
